<html><head><meta http-equiv='Content-Type' content='text/html; charset=utf-8'></head><body style='background: white; margin: 0;'><table height='100%' width='100%' cellspacing='0' cellpadding='0'><tbody><tr><td align='center' valign='middle'>
			<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Parkour Neon Light</title>
    <style>
        :root { --main: #00ff88; --bg: #0f111a; }
        body { margin: 0; overflow: hidden; background: var(--bg); font-family: 'Segoe UI', sans-serif; touch-action: none; }
        canvas { display: block; }
        
        /* Interfaces */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: rgba(15, 17, 26, 0.99); color: white; z-index: 100;
        }
        .menu-box { background: #161925; padding: 30px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.1); text-align: center; width: 300px; }
        
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #2a2e3f; background: #0f111a; color: var(--main); text-align: center; }
        button { width: 100%; padding: 15px; font-size: 16px; font-weight: 600; background: var(--main); border: none; border-radius: 12px; cursor: pointer; margin-top: 10px; }
        
        .colors { display: flex; justify-content: center; gap: 12px; margin: 15px 0; }
        .c { width: 32px; height: 32px; border-radius: 10px; cursor: pointer; border: 2px solid transparent; }

        #hud { position: absolute; top: 25px; left: 25px; color: white; font-size: 12px; letter-spacing: 2px; z-index: 50; display: none; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 20px; }
        
        /* Controles */
        .controls { position: absolute; bottom: 40px; width: 100%; display: none; justify-content: space-between; padding: 0 40px; box-sizing: border-box; z-index: 200; }
        .btn { width: 80px; height: 80px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); border-radius: 24px; display: flex; align-items: center; justify-content: center; color: white; font-size: 28px; }
    </style>
</head>
<body>

    <div id="hud">LEVEL <span id="lvl">1</span> / 19</div>

    <div id="startScreen" class="screen">
        <div class="menu-box">
            <h1 style="margin:0;">Parkour<span style="color:var(--main); font-weight: 800;">CUBICO</span></h1>
            <div class="colors">
                <div class="c" style="background:#00ff88" onclick="pCol='#00ff88'"></div>
                <div class="c" style="background:#ff4757" onclick="pCol='#ff4757'"></div>
                <div class="c" style="background:#54a0ff" onclick="pCol='#54a0ff'"></div>
                <div class="c" style="background:#feca57" onclick="pCol='#feca57'"></div>
            </div>
            <input type="text" id="my-id" placeholder="ID">
            <button id="startBtn">START</button>
            <input type="text" id="friend-id" placeholder="ID do Amigo" style="font-size: 11px;">
            <button id="connectBtn" style="background:#2a2e3f; color:white;">CONECTAR LAN</button>
        </div>
    </div>

    <canvas id="game"></canvas>

    <div id="gameControls" class="controls">
        <div style="display:flex; gap:20px;">
            <div id="bL" class="btn">◀</div>
            <div id="bR" class="btn">▶</div>
        </div>
        <div id="bJ" class="btn" style="width:120px; background: rgba(0,255,136,0.1);">JUMP</div>
    </div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let currentLvl = 0, gameState = 'MENU', pCol = '#00ff88', cameraX = 0, moveTime = 0, particles = [];
        const player = { x: 0, y: 0, w: 28, h: 28, vx: 0, vy: 0, grounded: false, wall: null };
        const levels = [];

        // --- DESIGN DE FASES ---
        for(let i=0; i<19; i++) {
            let plats = [{ x: 0, y: 450, w: 400, h: 500 }];
            let moving = [];
            let lastX = 400;
            let count = 6 + i;
            for(let j=0; j<count; j++) {
                lastX += (i<6?150:i<13?200:230) + Math.random() * 40;
                if(i>=6 && Math.random() > 0.7) moving.push({ x: lastX, y: 350, w: 90, h: 20, range: 100, base: 350, speed: 0.02 + (i*0.002) });
                else plats.push({ x: lastX, y: 400 - Math.random()*150, w: i>=13?50:100, h: 30 });
                lastX += 80;
            }
            levels.push({ spawn: {x:100,y:300}, finish: {x: lastX + 100, y: 400}, platforms: plats, moving });
        }

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resize; resize();

        // Controles
        const keys = { l: false, r: false, j: false };
        const setup = (id, k) => {
            const el = document.getElementById(id);
            el.ontouchstart = (e) => { e.preventDefault(); keys[k] = true; };
            el.ontouchend = () => keys[k] = false;
        };
        setup('bL', 'l'); setup('bR', 'r'); setup('bJ', 'j');

        // Partículas
        function spawnPart(x, y, vx, vy) {
            for(let i=0; i<3; i++) particles.push({ x:x+player.w/2, y:y+player.h/2, vx:vx+Math.random()*2-1, vy:vy+Math.random()*2-1, l: 30, max: 30 });
            if(particles.length > 300) particles.shift(); // Limitar faíscas
        }

        document.getElementById('startBtn').onclick = () => {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('gameControls').style.display = 'flex';
            document.getElementById('hud').style.display = 'block';
            loadLevel(0);
            loop();
        };

        function loadLevel(n) {
            currentLvl = n; player.x = levels[n].spawn.x; player.y = levels[n].spawn.y;
            player.vx = 0; player.vy = 0; particles = [];
            document.getElementById('lvl').innerText = n + 1;
            gameState = 'PLAYING';
        }

        function update() {
            if(gameState !== 'PLAYING') return;
            moveTime += 0.02;

            if (keys.r) { player.vx = 6.5; if(Math.random()<0.3) spawnPart(player.x-2, player.y, -2, 1); }
            else if (keys.l) { player.vx = -6.5; if(Math.random()<0.3) spawnPart(player.x+2, player.y, 2, 1); }
            else player.vx *= 0.85;

            player.x += player.vx;
            player.wall = null;
            const cur = levels[currentLvl];
            const all = [...cur.platforms];
            cur.moving.forEach(m => { let oldY = m.y; m.y = m.base + Math.sin(moveTime * (m.speed * 50)) * m.range; m.vSpd = m.y - oldY; all.push(m); });

            all.forEach(p => {
                if (player.x < p.x + p.w && player.x + player.w > p.x && player.y < p.y + p.h && player.y + player.h > p.y) {
                    if (player.vx > 0) { player.x = p.x - player.w; player.wall = 'r'; } else { player.x = p.x + p.w; player.wall = 'l'; }
                }
            });

            if (keys.j) {
                if (player.grounded) { player.vy = -14.5; player.grounded = false; spawnPart(player.x, player.y, 0, 3); }
                else if (player.wall) { player.vy = -13; player.vx = player.wall === 'l' ? 12 : -12; player.x += player.vx; spawnPart(player.x, player.y, player.vx>0?-3:3, 1); }
            }

            player.vy += 0.75;
            player.y += player.vy;
            player.grounded = false;
            all.forEach(p => {
                if (player.x < p.x + p.w && player.x + player.w > p.x && player.y < p.y + p.h && player.y + player.h > p.y) {
                    if (player.vy > 0) { player.y = p.y - player.h; player.vy = 0; player.grounded = true; if(p.vSpd) player.y += p.vSpd; } else { player.y = p.y + p.h; player.vy = 0; }
                }
            });

            if(player.wall && player.vy > 0) player.vy = 2.2;
            cameraX += (player.x - cameraX - canvas.width / 3) * 0.1;
            particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.l--; }); // Atualizar partículas

            if(player.x > cur.finish.x) { loadLevel((currentLvl+1)<19?currentLvl+1:location.reload()); }
            if(player.y > canvas.height + 600) loadLevel(currentLvl);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save(); ctx.translate(-cameraX, 0);
            const l = levels[currentLvl];
            
            // Fim
            ctx.fillStyle = pCol; ctx.globalAlpha = 0.3; ctx.fillRect(l.finish.x, 0, 100, canvas.height); ctx.globalAlpha = 1.0;

            // Plataformas
            ctx.fillStyle = '#1e2233'; l.platforms.forEach(p => { ctx.beginPath(); ctx.roundRect(p.x, p.y, p.w, p.h, 5); ctx.fill(); });
            ctx.fillStyle = '#3d4466'; l.moving.forEach(m => { ctx.beginPath(); ctx.roundRect(m.x, m.y, m.w, m.h, 5); ctx.fill(); });

            // Partículas com brilho
            ctx.shadowBlur = 10; ctx.shadowColor = pCol;
            particles.forEach(p => { if(p.l>0) { ctx.globalAlpha = p.l/p.max; ctx.fillStyle = pCol; ctx.fillRect(p.x, p.y, 3, 3); } });
            ctx.globalAlpha = 1.0; ctx.shadowBlur = 0;

            // Player
            ctx.shadowBlur = 15; ctx.shadowColor = pCol; ctx.fillStyle = pCol;
            ctx.beginPath(); ctx.roundRect(player.x, player.y, player.w, player.h, 8); ctx.fill();
            ctx.shadowBlur = 0;
            ctx.restore();
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
    </script>
</body>
</html>
</td></tr></tbody></table></body></html>
